# A3 — Reactivation (Track A / Studio). Past clients + dead quotes.
# Lead with what has CHANGED since we last spoke, never "just checking in".
id: A3-reactivation
track: Studio
sources: [Past Client, Referral, Other]
fromMailbox: warm
cold: false
steps:
  - dayOffset: 0
    purpose: Reopen the conversation by leading with a concrete change since we last spoke.
    guidance: >
      Acknowledge we spoke before (use the relationship context). Lead with one
      genuinely useful capability that is new or sharper now — not a check-in.
      End with a low-friction ask: a short call via the booking link, or a reply.
    exitConditions: [reply, booked, unsubscribed]
  - dayOffset: 5
    purpose: Add a second concrete angle and make the value specific to their kind of work.
    guidance: >
      Reference the studio/VP angle most relevant to their previous project.
      One useful, specific point. Soft ask, no pressure.
    exitConditions: [reply, booked, unsubscribed]
  - dayOffset: 14
    purpose: Graceful breakup — give them an easy out, which is what gets replies.
    guidance: >
      Short. "Still live, or has this moved on?" Make it effortless to say either.
      This is the highest-reply touch — write it properly.
    exitConditions: [reply, booked, unsubscribed]
