# A3 — Reactivation (Track A / Studio). Past clients + dead quotes.
# These people already know us (or have at least heard from us). The register is
# a personal note from Daniel — one thought, no capability lists, never a pitch.
id: A3-reactivation
track: Studio
sources: [Past Client, Referral, Other]
fromMailbox: warm
cold: false
steps:
  - dayOffset: 0
    purpose: Restart a human conversation — a short personal note, not a sales email.
    guidance: >
      Match the relationship context exactly (a real conversation vs a one-way
      reach-out). This is a note, not a pitch: one thought only. Ask a genuine
      question about what they are making at the moment — that question IS the
      email. If one concrete change at our end fits naturally in a single line,
      mention it; otherwise leave it out. No lists of what we do. Low-friction
      close: a reply beats a booking link here.
    exitConditions: [reply, booked, unsubscribed]
  - dayOffset: 5
    purpose: One specific thought relevant to their kind of work. Still a note.
    guidance: >
      Pick ONE angle that fits the work they actually do and say something
      useful about it in a sentence or two — an observation, not a feature.
      Do not repeat step 1 and do not add a second angle. Soft ask, no pressure.
    exitConditions: [reply, booked, unsubscribed]
  - dayOffset: 14
    purpose: Graceful breakup — give them an easy out, which is what gets replies.
    guidance: >
      Short. "Still live, or has this moved on?" Make it effortless to say
      either. No facts, no selling. This is the highest-reply touch — write it
      like a person, not a system.
    exitConditions: [reply, booked, unsubscribed]
