# B3 — Reactivation (Track B / VFX). Past post/finishing clients + dead quotes.
id: B3-reactivation
track: VFX
sources: [Past Client, Referral, Other]
fromMailbox: warm
cold: false
steps:
  - dayOffset: 0
    purpose: Reopen with what has changed in our post/finishing capacity since we last spoke.
    guidance: Acknowledge the prior conversation; lead with a concrete finishing capability, not a check-in. Low-friction ask.
    exitConditions: [reply, booked, unsubscribed]
  - dayOffset: 5
    purpose: A second concrete angle specific to their finishing needs (comp, cleanup, green-screen finishing).
    guidance: One specific, useful point about the post work most relevant to them.
    exitConditions: [reply, booked, unsubscribed]
  - dayOffset: 14
    purpose: Graceful breakup.
    guidance: Short. "Still live, or has this moved on?" Easy to answer either way.
    exitConditions: [reply, booked, unsubscribed]
