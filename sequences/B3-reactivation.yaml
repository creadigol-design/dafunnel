# B3 — Reactivation (Track B / VFX). Past post/finishing clients + dead quotes.
# Same register as A3: a personal note from Daniel — one thought, never a pitch.
id: B3-reactivation
track: VFX
sources: [Past Client, Referral, Other]
fromMailbox: warm
cold: false
steps:
  - dayOffset: 0
    purpose: Restart a human conversation — a short personal note, not a sales email.
    guidance: >
      Match the relationship context exactly (a real conversation vs a one-way
      reach-out). One thought only: ask a genuine question about what they are
      cutting or finishing at the moment. Mention one concrete change at our
      end only if it fits in a single natural line. No capability lists.
      A reply beats a booking link here.
    exitConditions: [reply, booked, unsubscribed]
  - dayOffset: 5
    purpose: One specific thought about the post work most relevant to them. Still a note.
    guidance: >
      ONE angle (comp, cleanup, green-screen finishing — whichever fits their
      work), said as an observation in a sentence or two, not a feature. Do not
      repeat step 1 or add a second angle. Soft ask.
    exitConditions: [reply, booked, unsubscribed]
  - dayOffset: 14
    purpose: Graceful breakup.
    guidance: >
      Short. "Still live, or has this moved on?" Easy to answer either way.
      No facts, no selling.
    exitConditions: [reply, booked, unsubscribed]
